              "name": "What is a Kundali?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A Kundali (also called Janam Kundali or Janam Patrika) is a Vedic birth chart that maps the exact position of the Sun, Moon, and planets in the 12 houses and 27 nakshatras at the moment of your birth. It is the foundation of Jyotish — Vedic astrology — and reveals your personality, life path, karmic patterns, and timing of major events."
              }
            },

              "@type": "Question",
              "name": "How is a Vedic Kundali different from Western astrology?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Vedic astrology uses the sidereal zodiac with the Lahiri Ayanamsa, which tracks the actual position of stars in the sky, while Western astrology uses the tropical zodiac fixed to the seasons. Vedic Kundali also uses the Vimshottari Dasha system to predict the timing of life events, the Moon-based Rashi as your primary sign, and 27 nakshatras for deeper accuracy."
              }
            },
            {
              "@type": "Question",
              "name": "Is the Kundali on VedicKundali.app really free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Generating your Vedic Kundali, viewing your daily horoscope and trying our dream interpretation oracle is completely free — no credit card required. Premium tiers unlock divisional charts, Sade Sati tracking and unlimited AI guidance."
              }
            },
            {
              "@type": "Question",
              "name": "What information do I need to create my Janam Kundali?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You need three things: your exact date of birth, the precise time of birth (down to the minute, from your birth certificate), and your birth city. The more accurate your birth time, the more precise your Vedic chart, dasha periods, and predictions will be."
              }
            },
            {
              "@type": "Question",
              "name": "Can a Kundali predict my future?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A Kundali reveals strong tendencies, karmic timing through dashas and transits, and areas of life requiring attention — but Vedic philosophy honors free will. Our AI provides ethical, non-fatalistic guidance: insights and remedies that empower you to make wiser choices, not deterministic predictions."
